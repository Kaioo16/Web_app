{% extends "base.html" %}

{% block content %}

<h2>Login</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">
    <input name="username" placeholder="Usuário">
    <input name="password" type="password" placeholder="Senha">
    <button>Entrar</button>
</form>

<a href="/register">Criar conta</a>

{% endblock %}
